services:
   postgres:
      image: postgres:16-alpine
      container_name: rentify-postgres
      restart: unless-stopped
      environment:
         POSTGRES_DB: rentify
         POSTGRES_USER: rentify
         POSTGRES_PASSWORD: rentify
      ports:
         - '5432:5432'
      volumes:
         - rentify_pg_data:/var/lib/postgresql
         - ./docker/postgres/init-citext.sql:/docker-entrypoint-initdb.d/init-citext.sql:ro
      healthcheck:
         test: ['CMD-SHELL', 'pg_isready -U rentify -d rentify']
         interval: 10s
         timeout: 5s
         retries: 5

   redis:
      image: redis:7-alpine
      container_name: rentify-redis
      restart: unless-stopped
      command: ['redis-server', '--appendonly', 'yes']
      ports:
         - '6379:6379'
      volumes:
         - rentify_redis_data:/data
      healthcheck:
         test: ['CMD', 'redis-cli', 'ping']
         interval: 10s
         timeout: 5s
         retries: 5

   meilisearch:
      image: getmeili/meilisearch:v1.9
      container_name: rentify-meilisearch
      restart: unless-stopped
      environment:
         - MEILI_ENV=development
         - MEILI_MASTER_KEY=rentify_master_key_123456
      ports:
         - '7700:7700'
      volumes:
         - rentify_meili_data:/meili_data

   server:
      build:
         context: ./server
         dockerfile: Dockerfile
      container_name: rentify-server
      restart: unless-stopped
      command: sh -c "npx prisma migrate deploy && node dist/main.js"
      ports:
         - '8080:8080'
      env_file:
         - path: ./server/.env
           required: false
      environment:
         - DATABASE_URL=postgresql://rentify:rentify@postgres:5432/rentify?schema=public
         - REDIS_URL=redis://redis:6379
         - MEILI_HOST=http://meilisearch:7700
         - MEILI_MASTER_KEY=rentify_master_key_123456
         - PORT=8080
      depends_on:
         postgres:
            condition: service_healthy
         redis:
            condition: service_healthy

   client:
      build:
         context: ./client
         dockerfile: Dockerfile
      container_name: rentify-client
      restart: unless-stopped
      ports:
         - '3000:3000'
      environment:
         - PORT=3000
      depends_on:
         - server

volumes:
   rentify_pg_data:
   rentify_redis_data:
   rentify_meili_data:
